<!DOCTYPE html>
<html lang="tr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>YÖKDİL Sosyal Bilimler AI</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #1f2937;
    }

    header {
      background: #111827;
      color: white;
      padding: 25px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
      opacity: .8;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .panel {
      background: white;
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 14px 22px;
      font-size: 16px;
      cursor: pointer;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }

    button:hover {
      opacity: .9;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .progress-area {
      margin-top: 20px;
    }

    .progress {
      height: 18px;
      background: #e5e7eb;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #2563eb;
      transition: width .4s;
    }

    #status {
      margin: 12px 0;
      font-weight: bold;
    }

    .stats {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .stat {
      background: #f3f4f6;
      padding: 15px 20px;
      border-radius: 10px;
    }

    .words {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(300px, 1fr));
      gap: 18px;
    }

    .word-card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
      border: 1px solid #e5e7eb;
    }

    .word-number {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .word-card h3 {
      margin: 0 0 10px;
      color: #111827;
      font-size: 22px;
    }

    .turkish {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .example {
      color: #4b5563;
      line-height: 1.6;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
      display: none;
    }

    .success {
      color: #166534;
    }

    .loading {
      color: #92400e;
    }

    @media(max-width:600px) {

      .words {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }

    }

  </style>

</head>


<body>


<header>

  <h1>📚 YÖKDİL Sosyal Bilimler AI</h1>

  <p>
    Akademik kelime hazinesi • 1000 kelime
  </p>

</header>


<div class="container">


  <!-- KELİME PANELİ -->

  <div class="panel">

    <h2>📖 1000 Akademik Kelime</h2>

    <p>
      YÖKDİL Sosyal Bilimler için
      yapay zekâ tarafından oluşturulan
      akademik kelime havuzu.
    </p>


    <button
      id="startButton"
      onclick="startVocabulary()"
    >
      🚀 1000 Kelimeyi Yükle
    </button>


    <div class="progress-area">

      <div id="status">
        Hazır.
      </div>

      <div class="progress">

        <div
          id="progressBar"
          class="progress-bar"
        ></div>

      </div>

    </div>


    <div class="stats">

      <div class="stat">
        📚 Kelime:
        <strong id="wordCount">0</strong>
      </div>

      <div class="stat">
        📦 Paket:
        <strong id="batchCount">0</strong> / 10
      </div>

    </div>


    <div
      id="errorBox"
      class="error"
    ></div>

  </div>


  <!-- KELİMELER -->

  <div class="panel">

    <h2>Kelime Havuzu</h2>

    <div
      id="vocabulary"
      class="words"
    ></div>

  </div>


</div>


<script>


// =====================================================
// GLOBAL
// =====================================================

let allWords = [];

const TOTAL_WORDS = 1000;

const TOTAL_BATCHES = 10;


// =====================================================
// SAYFA AÇILINCA LOCAL STORAGE
// =====================================================

window.addEventListener(
  "DOMContentLoaded",
  () => {

    const saved =
      localStorage.getItem(
        "yokdil_words"
      );

    if (saved) {

      try {

        allWords =
          JSON.parse(saved);

        renderVocabulary(
          allWords
        );

        updateProgress();

        document.getElementById(
          "status"
        ).textContent =
          `💾 ${allWords.length} kelime kayıtlı.`;

      } catch {

        localStorage.removeItem(
          "yokdil_words"
        );

      }

    }

  }
);


// =====================================================
// 1000 KELİME BAŞLAT
// =====================================================

async function startVocabulary() {

  const button =
    document.getElementById(
      "startButton"
    );

  const errorBox =
    document.getElementById(
      "errorBox"
    );


  errorBox.style.display =
    "none";


  button.disabled =
    true;


  // Eğer zaten 1000 varsa
  if (allWords.length >= TOTAL_WORDS) {

    document.getElementById(
      "status"
    ).textContent =
      "✅ 1000 kelime zaten hazır.";

    button.disabled =
      false;

    return;
  }


  try {


    // Mevcut kelimeler devam ettirilsin

    const startBatch =
      Math.floor(
        allWords.length / 100
      ) + 1;


    for (
      let batch = startBatch;
      batch <= TOTAL_BATCHES;
      batch++
    ) {


      document.getElementById(
        "status"
      ).textContent =
        `⏳ ${batch}. paket hazırlanıyor...`;


      // Önceki kelimeleri gönder

      const exclude =
        allWords
          .map(
            word => word.en
          )
          .slice(-500);


      const response =
        await fetch(
          "/api/chat",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                action:
                  "vocabulary",

                batch:
                  batch,

                exclude:
                  exclude

              })
          }
        );


      // Önce text alıyoruz

      const text =
        await response.text();


      let data;


      try {

        data =
          JSON.parse(text);

      } catch {

        throw new Error(
          "Sunucudan geçerli JSON gelmedi: " +
          text.substring(0, 300)
        );

      }


      if (!response.ok) {

        throw new Error(
          data.error ||
          `API hatası: ${response.status}`
        );

      }


      const words =
        Array.isArray(
          data.words
        )
          ? data.words
          : [];


      if (
        words.length === 0
      ) {

        throw new Error(
          `${batch}. pakette kelime gelmedi.`
        );

      }


      // ============================================
      // DUPLICATE KONTROLÜ
      // ============================================

      const existing =
        new Set(
          allWords.map(
            word =>
              word.en.toLowerCase()
          )
        );


      const newWords =
        words.filter(
          word => {

            const key =
              word.en
                .trim()
                .toLowerCase();

            if (
              existing.has(key)
            ) {
              return false;
            }

            existing.add(key);

            return true;

          }
        );


      // Yeni kelimeleri ekle

      allWords.push(
        ...newWords
      );


      // Maksimum 1000

      if (
        allWords.length >
        TOTAL_WORDS
      ) {

        allWords =
          allWords.slice(
            0,
            TOTAL_WORDS
          );

      }


      // ============================================
      // KAYDET
      // ============================================

      localStorage.setItem(
        "yokdil_words",
        JSON.stringify(
          allWords
        )
      );


      // ============================================
      // EKRANA BAS
      // ============================================

      renderVocabulary(
        allWords
      );


      updateProgress();


      document.getElementById(
        "batchCount"
      ).textContent =
        batch;


      document.getElementById(
        "status"
      ).textContent =
        `✅ ${allWords.length} kelime yüklendi.`;


      // 1000 tamamlandıysa

      if (
        allWords.length >=
        TOTAL_WORDS
      ) {

        break;

      }

    }


    // ============================================
    // SON DURUM
    // ============================================

    if (
      allWords.length >=
      TOTAL_WORDS
    ) {

      document.getElementById(
        "status"
      ).textContent =
        "🎉 1000 kelime başarıyla hazır!";

    } else {

      document.getElementById(
        "status"
      ).textContent =
        `${allWords.length} kelime hazır. Eksik paketler tekrar yüklenebilir.`;

    }


  } catch (error) {

    console.error(
      error
    );


    errorBox.textContent =
      "❌ " +
      error.message;


    errorBox.style.display =
      "block";


    document.getElementById(
      "status"
    ).textContent =
      "⚠️ Yükleme sırasında hata oluştu.";

  }


  button.disabled =
    false;

}


// =====================================================
// İLERLEME
// =====================================================

function updateProgress() {

  const count =
    allWords.length;


  document.getElementById(
    "wordCount"
  ).textContent =
    count;


  const percentage =
    Math.min(
      100,
      (count / TOTAL_WORDS) *
      100
    );


  document.getElementById(
    "progressBar"
  ).style.width =
    percentage + "%";

}


// =====================================================
// KELİMELERİ EKRANA BAS
// =====================================================

function renderVocabulary(
  words
) {

  const container =
    document.getElementById(
      "vocabulary"
    );


  container.innerHTML =
    words.map(
      (word, index) => `

        <div class="word-card">

          <div class="word-number">
            #${index + 1}
          </div>

          <h3>
            ${escapeHtml(
              word.en
            )}
          </h3>

          <div class="turkish">
            🇹🇷
            ${escapeHtml(
              word.tr
            )}
          </div>

          <div class="example">
            ${escapeHtml(
              word.example
            )}
          </div>

        </div>

      `
    ).join("");

}


// =====================================================
// HTML GÜVENLİĞİ
// =====================================================

function escapeHtml(
  text
) {

  if (!text) {
    return "";
  }


  return String(text)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

</script>


</body>

</html>
